<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Cart Page</h1>
    <div id="showCart"></div>
</body>
</html>
<script>
    // getItems from local storage and show it on UI
    let showCart=document.getElementById("showCart")
    let cartProducts=JSON.parse(localStorage.getItem("cart"))
    cartProducts.forEach(element => {
        showCart.innerHTML+=`
            <h3>${element.id}</h3>
                <h3>${element.title}</h3>
                <img height="100px" src="${element.images[0]}">
        `
    });
</script>
