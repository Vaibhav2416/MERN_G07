<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body{
      background:#f4f4f4;
    }

    .student-card{
      border:2px solid #0d6efd;
      border-radius:12px;
      padding:20px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>  
<div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Signup Form</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">
            <input
              type="text"
              id="name"
              class="form-control mb-3"
              placeholder="Enter Name"
              required
            >

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="text"
              id="password"
              class="form-control mb-3"
              placeholder="Enter password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>

</body>
</html>
<script>
    let users_array=[]
    let handleSubmit=(event)=>{
        event.preventDefault()
        let name=document.getElementById("name")
        let email=document.getElementById("email")
        let password=document.getElementById("password")

        let user={
            username:name.value,
            useremail:email.value,
            userpassword:password.value
        }

        let get_user=localStorage.getItem("users")
        console.log(get_user)
        if(get_user){
            users_array=JSON.parse(get_user)
        }
        // check whether user already present or not
        // some method => alert if user already exists
        let check_user=users_array.some((el)=>el.useremail==email.value)
        console.log(check_user)
        if(check_user) return alert("User already present") 

        users_array.push(user)
        
        // [{uname:"Aman",uemail:"aman@email.com",upass:123}]
        localStorage.setItem("users",JSON.stringify(users_array))

        window.location.href="login.html"

        // local-storage ->
        // Web browser feature to store data in local system
        // signup ==> we will register multiple users => LS
        // Login => verify user credentials with db/ls users
        // products.html 
    }
</script>
