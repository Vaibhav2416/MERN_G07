<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="container">
        <h1>Product Page</h1>
        <h3 id="name">Name: </h3>
        <button onclick="handleLogout()">Logout</button>
        <a href="cart.html">Cart Page</a>
        <b></b>
        <div id="cards">

        </div>
    </div>
    <div id="FalseUser">
        
    </div>
</body>
</html>
<script>
    let container=document.getElementById("container")
    let falseUser=document.getElementById("FalseUser")
    let check_status=sessionStorage.getItem("isLoggedIn")
    let current_user=JSON.parse(sessionStorage.getItem("current_user"))
    let name=document.getElementById("name")
    let cards=document.getElementById("cards")

    if(check_status=="true"){
        name.innerHTML=`<h1>Name:${current_user.username}</h1>`
        container.style.display="block" // show content 
    }else{
        container.style.display="none" // hide content
        falseUser.innerHTML=`<h1>Do Login First</h1>
        <a href="login.html">Click here to login</a>`
    }

    let handleLogout=()=>{
        sessionStorage.removeItem("isLoggedIn")
        sessionStorage.removeItem("current_user")
        window.location.reload()
    }
    // signup => name,email,password  => localstorage (setItem)
    // login page => verified user by making get request (getItem)
    // product => if user present then show main content
    //        => otherwise we redirected user to login page 

    // fetch ==> .then method ==> async await
    let items=[]
    let fetchData=async()=>{
        let resp=await fetch("https://dummyjson.com/products")
        let data=await resp.json()
        let products=data.products
        items=products
        localStorage.setItem("products",JSON.stringify(products))
        
        // [{"id":1,"title":"Laptop","images":[]}]
        products.forEach(element => {
            cards.innerHTML+=`
                <h3>${element.id}</h3>
                <h3>${element.title}</h3>
                <img height="100px" src="${element.images[0]}">
                <button onclick="handleCart(${element.id})">Add to Cart</button>
            `
        });

    } 
    fetchData()

    let handleCart=(id)=>{
        alert(`clicked ${id}`)
        let matchedObject=items.find((el)=>el.id==id)
        console.log(matchedObject)
        let cartItems=JSON.parse(localStorage.getItem("cart")) || []
        // if cartItems already present in storage then 
        // just bring them and store new Item 
        // otherwise just create empty array and push first product
        cartItems.push(matchedObject)
        localStorage.setItem("cart",JSON.stringify(cartItems))

    }
</script>
