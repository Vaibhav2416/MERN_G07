<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    body{
      background:#f4f4f4;
    }

    .student-card{
      border:2px solid #0d6efd;
      border-radius:12px;
      padding:20px;
      background:white;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>  
<div class="container py-5">
  <div class="row justify-content-center">

    <!-- Form -->
    <div class="col-md-5">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">Login Page</h3>

          <form id="studentForm" onsubmit="handleSubmit(event)">

            <input
              type="email"
              id="email"
              class="form-control mb-3"
              placeholder="Enter Email"
              required
            >

            <input
              type="text"
              id="password"
              class="form-control mb-3"
              placeholder="Enter password"
              required
            >

            <button class="btn btn-primary w-100">
              Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Output -->
    <div class="col-md-5 mt-4 mt-md-0">
      <div id="output"></div>
    </div>

  </div>
</div>

</body>
</html>
<script>
    let handleSubmit=(event)=>{
        event.preventDefault()
        let email=document.getElementById("email")
        let password=document.getElementById("password")
        // console.log(email.value)
        // get request => to local storage
        
        let users=JSON.parse(localStorage.getItem("users"))
        console.log(users)
        // user enter ==> email.value ==> man@email.com
        //[{"email":"aman"},{email:"vaibhav"}]
        let verified_user=users.find((el)=>el.useremail==email.value)
        // find=> single object according to specified condition
        // filter => returns array of matching objects
        // {"email":"aman@gmail.com","password":123} == aman@gmail.com
        console.log(verified_user) 
        if(verified_user && verified_user.userpassword==password.value){
        // localStorage.setItem("current_user",JSON.stringify(verified_user))
        // localStorage.setItem("isLoggedIn","true")

        sessionStorage.setItem("current_user",JSON.stringify(verified_user))
        sessionStorage.setItem("isLoggedIn","true")

        alert("User Logged In Successfully")
        window.location.href="products.html"
        }else{
            alert("Invalid Credentials")
        }
        // amazon ==> register ==> login (credentials entered) 
        // backend ==> token ==> user information present here
    }

    // Session Storage
    // It will store data in browser temprorily means
    // for current session or till browser or tab closes

    // getItem
    // setItem

</script>
